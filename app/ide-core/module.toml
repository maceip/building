version = 2

[module]
type = "java-lib"
name = "ide-core"
languageLevel = "JAVA_17"
output = "build/codeassist/classes"

[sourceSets.main]
scope = "IMPLEMENTATION"
java = ["src/main/kotlin"]
resources = ["src/main/resources"]

[sourceSets.test]
scope = "TEST_IMPLEMENTATION"
java = ["src/test/kotlin"]

[dependencies]
api = [{ module = "ide-ui" }, { module = "developer-workbench" }, { module = "interp-api" }, { module = "layout-preview-api" }, { module = "analytics-api" }, { module = "store-api" }]
implementation = [{ module = "platform-core" }, { module = "platform-json" }, { module = "project-model-api" }, { module = "project-model-impl" }, { module = "project-templates" }, { module = "language-api" }, { module = "lang-jdt" }, { module = "lang-java" }, { module = "lang-xml" }, { module = "lang-kotlin" }, { module = "lang-ksp" }, { module = "interp-impl" }, { module = "decompiler" }, { module = "index-api" }, { module = "index-impl" }, { module = "analysis-api" }, { module = "analysis-impl" }, { module = "block-api" }, { module = "block-impl" }, { module = "plugin-api" }, { module = "plugin-impl" }, { module = "build-api" }, { module = "build-engine" }, { module = "jvm-build" }, { module = "gradle-build" }, { module = "android-support" }, { module = "layout-preview-impl" }, { module = "deps-api" }, { module = "deps-impl" }, { module = "agent-impl" }, { module = "agent-mcp" }, { module = "agent-ui" }, { module = "vcs-impl" }, { module = "vcs-ui" }, { module = "store-impl" }, { module = "store-bridge" }, { module = "model-bridge" }, { module = "vfs-api" }, "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0", "com.squareup.okhttp3:okhttp:4.12.0", "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1", "kotlin-stdlib"]
testImplementation = [{ platform = "org.junit:junit-bom:5.11.4" }, "org.jetbrains.kotlin:kotlin-test:2.5.0-Beta2", { module = "test-support" }, "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0", { module = "store-impl" }, { module = "bench-support" }, "org.bouncycastle:bcpkix-jdk18on:1.78.1"]
