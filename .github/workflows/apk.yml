name: APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# Build the installable Android APK (:ide-android). Unlike the framework jobs, this needs the full
# module set (CI_CORE_ONLY must stay unset) and the Android SDK; the runner's stock SDK plus the exact
# platform AGP wants (android-36.1 for compileSdk=36 + compileSdkMinor=1) are provisioned with
# setup-android. The `debug` variant is signed with the debug key so the artifact installs directly.
env:
  JAVA_VERSION: "25"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Provision the Android SDK the module needs (licenses accepted by setup-android). sdkmanager is a
      # no-op for components the runner already ships.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 platforms;android-36.1 build-tools;36.0.0 ndk;27.3.13750724"

      # Same as the framework jobs: one-shot CI builds gain nothing from incremental compilation.
      - name: Disable Kotlin incremental compilation (CI)
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.incremental=false" >> ~/.gradle/gradle.properties

      # Debug-only packaging fits 4 GiB; full local APK+AAB builds use the larger project default.
      - name: Build debug APK
        run: ./gradlew :ide-android:assembleDebug -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" --console=plain --stacktrace

      - name: Verify packaged development runtime
        run: |
          python3 -m unittest discover -s tools/packaging -p 'test_*.py'
          python3 tools/packaging/audit.py app/ide-android/build/outputs/apk/debug/ide-android-debug.apk --report build/reports/packaging/debug.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codeassist-debug-apk
          path: app/ide-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload packaging inventory
        uses: actions/upload-artifact@v4
        with:
          name: packaging-inventory
          path: build/reports/packaging/*.json
          if-no-files-found: error
          retention-days: 30
