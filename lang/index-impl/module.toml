version = 2

[module]
type = "java-lib"
name = "index-impl"
languageLevel = "JAVA_17"
output = "build/codeassist/classes"

[sourceSets.commonMain]
scope = "IMPLEMENTATION"
java = ["src/commonMain/kotlin"]

[sourceSets.commonTest]
scope = "TEST_IMPLEMENTATION"
java = ["src/commonTest/kotlin"]

[sourceSets.jvmMain]
scope = "IMPLEMENTATION"
java = ["src/jvmMain/kotlin"]

[sourceSets.jvmTest]
scope = "TEST_IMPLEMENTATION"
java = ["src/jvmTest/kotlin"]

[dependencies]
api = [{ module = "model-api" }]
implementation = [{ module = "kotlin-classfile" }, "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0", { module = "index-api" }, { module = "platform-core" }, { module = "language-api" }, "kotlin-stdlib"]
testImplementation = [{ module = "lang-kotlin-index" }, { module = "test-support" }, { module = "bench-support" }, { platform = "org.junit:junit-bom:5.11.4" }]

[kotlin]
commonSourceRoots = ["src/commonMain/kotlin"]
