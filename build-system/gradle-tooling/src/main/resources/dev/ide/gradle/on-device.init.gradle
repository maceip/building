/**
 * One init script for every Tooling API launch. It is not written into the project.
 *
 * It keeps the APK on arm64-v8a, points every JavaExec at JAVA_HOME/bin/java, rewrites native
 * classifier artifacts onto the jar published by the same module, and records a model JSON the
 * client can read without putting AGP's builder model on the client classpath.
 *
 * Groovy, and only APIs Gradle 8.6 already has.
 */
import org.gradle.api.artifacts.ExternalModuleDependency
import org.gradle.api.provider.Property
import org.gradle.api.tasks.JavaExec
import org.gradle.api.DefaultTask
import org.gradle.api.GradleException
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.InputFile
import org.gradle.api.tasks.Internal
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.OutputFile
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.TaskAction

// Only public Gradle/AGP APIs are used below. AGP is loaded by the app project, not this init script.
// These tasks are deliberately not cacheable: their debug config contains a host-private pairing nonce.
abstract class IdeReliabilityAssets extends DefaultTask {
    @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getConfigFile()
    @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getDescriptorFile()
    @Input abstract Property<String> getArtifactBuildId()
    @OutputDirectory abstract DirectoryProperty getAssetDirectory()
    @OutputDirectory abstract DirectoryProperty getJavaDirectory()
    @Internal abstract ConfigurableFileCollection getOtherAssets()

    static String sha256(File file) {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        file.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        return digest.digest().encodeHex().toString()
    }

    @TaskAction void generate() {
        def descriptor = new groovy.json.JsonSlurper().parse(descriptorFile.get().asFile, 'UTF-8')
        def config = new groovy.json.JsonSlurper().parse(configFile.get().asFile, 'UTF-8')
        def root = new File(descriptor.projectRoot.toString()).canonicalFile.toPath()
        def optionsFile = root.resolve('.building/reliability.json').toFile()
        if (!optionsFile.isFile()) throw new GradleException('Reliability: project consent was removed; start a new build.')
        def options = new groovy.json.JsonSlurper().parse(optionsFile, 'UTF-8')
        def defaults = [version: 1, enabled: false, consentGranted: false, captureCrashes: true,
                        captureLifecycle: true, capturePreviousExitInfo: true, captureNetwork: false,
                        teeStdout: false, productionEnabled: false]
        if (!(options instanceof Map) || !defaults.keySet().containsAll(options.keySet()) ||
                (defaults + options) != descriptor.options) {
            throw new GradleException('Reliability: project consent changed; start a new build.')
        }
        // Recheck the host snapshot immediately before compilation; the host also rechecks the canonical
        // snapshot AFTER execute, which catches additions/removals and edits made while Gradle was running.
        descriptor.sourceFiles.each { relative, expected ->
            def path = root.resolve(relative.toString()).normalize()
            if (!path.startsWith(root) || path.toFile().canonicalFile.toPath() != path ||
                    !java.nio.file.Files.isRegularFile(path, java.nio.file.LinkOption.NOFOLLOW_LINKS) ||
                    sha256(path.toFile()) != expected) {
                throw new GradleException('Reliability: sources changed since pairing; start a new build.')
            }
        }
        if (config.version != 1 || config.enabled != true || config.consentGranted != true ||
                config.buildId != artifactBuildId.get() || config.sourceRevision != descriptor.sourceRevision) {
            throw new GradleException('Reliability: invalid generated build configuration.')
        }
        otherAssets.files.each { directory ->
            ['ide-reliability.json', 'ide-reliability-sources.json'].each { reserved ->
                if (new File(directory, reserved).exists()) {
                    throw new GradleException('Reliability: app assets already contain a reserved generated configuration/source asset.')
                }
            }
        }
        def assets = assetDirectory.get().asFile
        assets.mkdirs()
        new File(assets, 'ide-reliability.json').setText(groovy.json.JsonOutput.toJson(config) + '\n', 'UTF-8')
        def publicManifest = [version: 1, buildId: config.buildId, sourceRevision: descriptor.sourceRevision,
                              files: descriptor.publicSources]
        new File(assets, 'ide-reliability-sources.json').setText(groovy.json.JsonOutput.toJson(publicManifest) + '\n', 'UTF-8')
        def source = new File(javaDirectory.get().asFile, 'dev/ide/applog/generated/ReliabilityBuildInfo.java')
        source.parentFile.mkdirs()
        // Hash/UUID only; no recipient, nonce, source path or user data is compiled into this class.
        source.setText('package dev.ide.applog.generated;\npublic final class ReliabilityBuildInfo {\n' +
                '  private ReliabilityBuildInfo() {}\n' +
                '  public static final String BUILD_ID = "' + config.buildId + '";\n' +
                '  public static final String SOURCE_REVISION = "' + descriptor.sourceRevision + '";\n}\n', 'UTF-8')
    }
}

abstract class IdeReliabilityManifest extends DefaultTask {
    @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getInputManifest()
    @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getConfigFile()
    @Input abstract Property<String> getApplicationId()
    @OutputFile abstract RegularFileProperty getOutputManifest()

    @TaskAction void inject() {
        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        factory.namespaceAware = true
        factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
        factory.setFeature('http://xml.org/sax/features/external-general-entities', false)
        factory.setFeature('http://xml.org/sax/features/external-parameter-entities', false)
        factory.expandEntityReferences = false
        def doc = factory.newDocumentBuilder().parse(inputManifest.get().asFile)
        def manifest = doc.documentElement
        def android = 'http://schemas.android.com/apk/res/android'
        manifest.setAttribute('xmlns:android', android)
        def children = { parent, tag ->
            def result = []
            for (int i = 0; i < parent.childNodes.length; i++) {
                def child = parent.childNodes.item(i)
                if (child instanceof org.w3c.dom.Element && child.tagName == tag) result << child
            }
            result
        }
        def apps = children(manifest, 'application')
        if (apps.size() != 1) throw new GradleException('Reliability: opted-in app manifest must contain one application.')
        def app = apps[0]
        if (app.getAttributeNS(android, 'hasCode') == 'false') app.setAttributeNS(android, 'android:hasCode', 'true')
        def providerClass = 'dev.ide.applog.IdeLogBridgeProvider'
        def providers = children(app, 'provider').findAll { it.getAttributeNS(android, 'name') == providerClass }
        if (providers.size() > 1) throw new GradleException('Reliability: duplicate SDK providers in the merged manifest.')
        def provider = providers ? providers[0] : doc.createElement('provider')
        if (!providers) app.appendChild(provider)
        provider.setAttributeNS(android, 'android:name', providerClass)
        provider.setAttributeNS(android, 'android:authorities', applicationId.get() + '.ide-reliability')
        provider.setAttributeNS(android, 'android:exported', 'false')
        provider.setAttributeNS(android, 'android:initOrder', '100')
        provider.removeAttributeNS(android, 'process')
        provider.removeAttributeNS(android, 'multiprocess')
        provider.removeAttributeNS(android, 'grantUriPermissions')
        children(app, 'meta-data').findAll { it.getAttributeNS(android, 'name') == 'dev.ide.reliability.CONFIG_ASSET' }
                .each { app.removeChild(it) }
        def metadata = doc.createElement('meta-data')
        metadata.setAttributeNS(android, 'android:name', 'dev.ide.reliability.CONFIG_ASSET')
        metadata.setAttributeNS(android, 'android:value', 'ide-reliability.json')
        app.appendChild(metadata)
        def config = new groovy.json.JsonSlurper().parse(configFile.get().asFile, 'UTF-8')
        def recipient = config.idePackage?.toString() ?: ''
        if (!recipient.isEmpty()) {
            def queries = children(manifest, 'queries')
            def query = queries ? queries[0] : doc.createElement('queries')
            if (!queries) manifest.appendChild(query)
            if (!children(query, 'package').any { it.getAttributeNS(android, 'name') == recipient }) {
                def pkg = doc.createElement('package')
                pkg.setAttributeNS(android, 'android:name', recipient)
                query.appendChild(pkg)
            }
        }
        def out = outputManifest.get().asFile
        out.parentFile.mkdirs()
        def transformer = javax.xml.transform.TransformerFactory.newInstance().newTransformer()
        transformer.setOutputProperty(javax.xml.transform.OutputKeys.ENCODING, 'UTF-8')
        transformer.transform(new javax.xml.transform.dom.DOMSource(doc), new javax.xml.transform.stream.StreamResult(out))
    }
}

def KEEP = "arm64-v8a"
def NATIVE = ["exe", "linux-x86_64", "osx-x86_64", "windows-x86_64"] as Set

def removed = Collections.synchronizedSet(new TreeSet())
def slots = new java.util.concurrent.ConcurrentHashMap()

def reliabilityInput = gradle.startParameter.projectProperties['dev.ide.reliability.input']
def reliabilityDescriptorFile = reliabilityInput ? new File(reliabilityInput.toString()).canonicalFile : null
def reliabilityDescriptor = null
def reliabilityMatched = Collections.synchronizedSet(new HashSet())
if (reliabilityDescriptorFile != null) {
    if (!reliabilityDescriptorFile.isFile() || reliabilityDescriptorFile.length() > 32L * 1024 * 1024) {
        throw new GradleException('Reliability: private injection descriptor is missing or too large.')
    }
    reliabilityDescriptor = new groovy.json.JsonSlurper().parse(reliabilityDescriptorFile, 'UTF-8')
    if (reliabilityDescriptor.version != 1 || reliabilityDescriptor.options?.enabled != true ||
            reliabilityDescriptor.options?.consentGranted != true || !(reliabilityDescriptor.variants instanceof List) ||
            !(reliabilityDescriptor.buildId ==~ /[0-9a-f-]{36}/) ||
            !(reliabilityDescriptor.sourceRevision ==~ /[0-9a-f]{64}/)) {
        throw new GradleException('Reliability: invalid private injection descriptor or missing project consent.')
    }
    def projectRoot = new File(reliabilityDescriptor.projectRoot.toString()).canonicalFile.toPath()
    if (reliabilityDescriptorFile.toPath().startsWith(projectRoot)) {
        throw new GradleException('Reliability: private config must not be stored in the user project.')
    }
}

def applyReliability = { p ->
    if (reliabilityDescriptor == null) return
    def requested = reliabilityDescriptor.variants.findAll { it.modulePath == p.path }
    if (requested.isEmpty()) return
    if (p.rootProject.projectDir.canonicalPath != reliabilityDescriptor.projectRoot) {
        throw new GradleException('Reliability: injection descriptor belongs to a different project.')
    }
    def components = p.extensions.findByName('androidComponents')
    if (components == null) throw new GradleException('Reliability: opted-in app requires public AGP variant APIs (AGP 8.4–9.x).')
    def version
    try { version = components.pluginVersion } catch (Exception problem) {
        throw new GradleException('Reliability: unable to determine AGP version; no automatic injection was applied.', problem)
    }
    if (!((version.major == 8 && version.minor >= 4) || version.major == 9) || version.preview != 0) {
        throw new GradleException("Reliability: unsupported AGP ${version}; use a stable AGP 8.4–9.x or disable project reliability injection.")
    }
    def agpLoader = components.class.classLoader
    def mergedManifest
    def applicationVariant
    try {
        // Public API classes, resolved from the project's AGP classloader, never AGP internal tasks.
        mergedManifest = agpLoader.loadClass('com.android.build.api.artifact.SingleArtifact$MERGED_MANIFEST').getField('INSTANCE').get(null)
        applicationVariant = agpLoader.loadClass('com.android.build.api.variant.ApplicationVariant')
    } catch (Exception problem) {
        throw new GradleException('Reliability: this AGP lacks required public application/manifest APIs; injection was not applied.', problem)
    }
    components.onVariants(components.selector().all()) { variant ->
        if (!applicationVariant.isInstance(variant)) return // Never nested tests, fixtures, libraries or features.
        def row = requested.find { it.variant == variant.name }
        if (row == null) return
        def debuggable = variant.debuggable
        def actualId = variant.applicationId.get()
        if (debuggable != row.debuggable || actualId != row.applicationId) {
            throw new GradleException('Reliability: applicationId/debuggable changed since sync; sync again before building.')
        }
        if (!debuggable && reliabilityDescriptor.options.productionEnabled != true) {
            throw new GradleException('Reliability: production injection requires explicit productionEnabled consent.')
        }
        def privateRoot = reliabilityDescriptorFile.parentFile.toPath()
        def configFile = new File(row.configFile.toString()).canonicalFile
        def generated = new File(row.outputDir.toString()).canonicalFile
        def runtime = new File(reliabilityDescriptor.runtimeArtifact.toString()).canonicalFile
        if (!configFile.toPath().startsWith(privateRoot) || !generated.toPath().startsWith(privateRoot) ||
                !runtime.toPath().startsWith(privateRoot) || !configFile.isFile() || !runtime.isFile() ||
                IdeReliabilityAssets.sha256(runtime) != reliabilityDescriptor.runtimeSha256) {
            throw new GradleException('Reliability: generated config/runtime must be intact in the host-private build cache.')
        }
        def config = new groovy.json.JsonSlurper().parse(configFile, 'UTF-8')
        if (config.version != 1 || config.enabled != true || config.consentGranted != true ||
                !(row.buildId ==~ /[0-9a-f-]{36}/) || config.buildId != row.buildId || config.sourceRevision != reliabilityDescriptor.sourceRevision) {
            throw new GradleException('Reliability: config does not match the opted-in build/source snapshot.')
        }
        if (config.idePackage || config.ideService || config.pairingNonce || config.ideSignerSha256) {
            if (!(config.idePackage ==~ /[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+/) ||
                    !(config.ideService ==~ /[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z_$][A-Za-z0-9_$]*)+/) ||
                    !(config.pairingNonce ==~ /[0-9a-f]{64}/) ||
                    (config.ideSignerSha256 && !(config.ideSignerSha256 ==~ /[0-9a-f]{64}/))) {
                throw new GradleException('Reliability: invalid explicit debug recipient/pairing fields.')
            }
        }
        if (!debuggable && (config.idePackage || config.ideService || config.pairingNonce || config.ideSignerSha256)) {
            throw new GradleException('Reliability: production configuration must not contain debug pairing/IPC fields.')
        }
        def runtimeConfiguration = variant.runtimeConfiguration
        def compileConfiguration = variant.compileConfiguration
        if (variant.sources.java == null || variant.sources.assets == null) {
            throw new GradleException('Reliability: this AGP variant does not expose generated Java/assets APIs.')
        }
        try {
            def suffix = variant.name.substring(0, 1).toUpperCase(java.util.Locale.ROOT) + variant.name.substring(1)
            def staticAssets = p.extensions.getByName('android').sourceSets.collectMany { sourceSet -> sourceSet.assets.srcDirs as List }
            def generation = p.tasks.register('generateIdeReliability' + suffix, IdeReliabilityAssets) { task ->
                task.configFile.set(configFile)
                task.descriptorFile.set(reliabilityDescriptorFile)
                task.artifactBuildId.set(row.buildId.toString())
                task.assetDirectory.set(new File(generated, 'assets'))
                task.javaDirectory.set(new File(generated, 'java'))
                task.otherAssets.from(staticAssets)
                task.outputs.upToDateWhen { false }
                task.outputs.doNotCacheIf('Contains an explicit debug pairing capability') { true }
            }
            variant.sources.assets.addGeneratedSourceDirectory(generation) { task -> task.assetDirectory }
            variant.sources.java.addGeneratedSourceDirectory(generation) { task -> task.javaDirectory }
            def manifestTask = p.tasks.register('injectIdeReliabilityManifest' + suffix, IdeReliabilityManifest) { task ->
                task.applicationId.set(variant.applicationId)
                task.configFile.set(configFile)
                task.outputManifest.set(new File(generated, 'manifest/AndroidManifest.xml'))
                task.dependsOn(generation)
            }
            variant.artifacts.use(manifestTask).wiredWithFiles(
                    { task -> task.inputManifest }, { task -> task.outputManifest }).toTransform(mergedManifest)
            // The artifacts API assigns its conventional output while wiring. Re-apply our public task
            // property afterwards so this transform also stays beside the private generated inputs.
            manifestTask.configure { task -> task.outputManifest.set(new File(generated, 'manifest/AndroidManifest.xml')) }
            // Public variant configurations, rather than guessed <variant>RuntimeClasspath names.
            // A file dependency also supports a standalone production AAR (AGP handles its manifest/rules).
            def dependencyBucket = p.configurations.create('ideReliability' + suffix) { bucket ->
                bucket.canBeResolved = false
                bucket.canBeConsumed = false
                bucket.visible = false
            }
            dependencyBucket.dependencies.add(p.dependencies.create(p.files(runtime)))
            compileConfiguration.extendsFrom(dependencyBucket)
            runtimeConfiguration.extendsFrom(dependencyBucket)
            reliabilityMatched.add(p.path + ':' + variant.name)
            p.logger.lifecycle('Reliability: explicitly opted-in ' + p.path + ':' + variant.name +
                    (debuggable ? ' (debug; recipient pairing still requires host approval)' : ' (production local journal only)'))
        } catch (Exception problem) {
            throw new GradleException('Reliability: required public AGP injection APIs are unavailable; no fallback task-name or build-file patching is attempted.', problem)
        }
    }
}

def modelOut = {
    def fromProp = gradle.startParameter.projectProperties["dev.ide.model.out"]
    if (fromProp != null && !fromProp.toString().isEmpty()) return fromProp.toString()
    return System.getenv("DEV_IDE_MODEL_OUT")
}()
def abiReport = {
    def fromProp = gradle.startParameter.projectProperties["dev.ide.abi.report"]
    if (fromProp != null && !fromProp.toString().isEmpty()) return fromProp.toString()
    return System.getenv("DEV_IDE_ABI_REPORT")
}()

def readNames = { value ->
    def names = []
    if (value == null) return names
    try {
        if (value instanceof Property) value = value.getOrElse(null)
    } catch (Throwable ignored) {}
    if (value instanceof Collection) value.each { if (it != null) names << it.toString() }
    else if (value != null) names << value.toString()
    return names
}

def writeNames = { owner, property, value ->
    try {
        if (value instanceof Property) {
            value.set([KEEP] as Set)
            return
        }
    } catch (Throwable ignored) {}
    if (value instanceof Collection) {
        try {
            value.clear()
            value.add(KEEP)
            return
        } catch (Throwable ignored) {}
    }
    try { owner."$property" = [KEEP] as Set } catch (Throwable ignored) {}
}

def noteRemoved = { names ->
    names.each { n -> if (n != KEEP && n.length() > 0) removed.add(n) }
}

def narrow = { p ->
    def android = null
    try { android = p.extensions.findByName("android") } catch (Throwable ignored) {}
    if (android == null) return
    try {
        def ndk = android.defaultConfig.ndk
        def names = readNames(ndk.abiFilters)
        noteRemoved(names)
        writeNames(ndk, "abiFilters", ndk.abiFilters)
    } catch (Throwable ignored) {}
    try {
        def enb = android.defaultConfig.externalNativeBuild
        ["cmake", "ndkBuild"].each { kind ->
            try {
                def block = enb."$kind"
                if (block == null) return
                def names = readNames(block.abiFilters)
                noteRemoved(names)
                writeNames(block, "abiFilters", block.abiFilters)
            } catch (Throwable ignored) {}
        }
    } catch (Throwable ignored) {}
    try {
        def abi = android.splits.abi
        def names = []
        try {
            if (abi.metaClass.respondsTo(abi, "getInclude")) names.addAll(readNames(abi.getInclude()))
        } catch (Throwable ignored) {}
        try {
            def inc = abi.include
            if (!(inc instanceof Closure)) names.addAll(readNames(inc))
        } catch (Throwable ignored) {}
        noteRemoved(names)
        try { abi.reset() } catch (Throwable ignored) {}
        try { abi.include(KEEP) } catch (Throwable ignored) {
            try {
                def inc = abi.include
                if (inc instanceof Collection) { inc.clear(); inc.add(KEEP) }
            } catch (Throwable ignored2) {}
        }
        try { abi.universalApk = false } catch (Throwable ignored) {}
        try { abi.isUniversalApk = false } catch (Throwable ignored) {}
        try { abi.setUniversalApk(false) } catch (Throwable ignored) {}
    } catch (Throwable ignored) {}
}

def pointAtJava = { t ->
    def home = System.getenv("JAVA_HOME")
    if (home == null || home.isEmpty()) return
    def bin = new File(home, "bin/java").absolutePath
    try {
        def exec = t.executable
        if (exec instanceof Property) {
            exec.set(bin)
            return
        }
    } catch (Throwable ignored) {}
    try { t.setExecutable(bin) } catch (Throwable ignored) {}
    try { t.executable = bin } catch (Throwable ignored) {}
}

def applyCmake = { p ->
    def ver = gradle.startParameter.projectProperties["dev.ide.cmake.version"]
    if (ver == null && System.getenv("DEV_IDE_CMAKE_FALLBACK") != "true") return
    if (ver == null) ver = System.getenv("DEV_IDE_CMAKE_VERSION")
    if (ver == null || ver.isEmpty()) return
    def android = null
    try { android = p.extensions.findByName("android") } catch (Throwable ignored) {}
    if (android == null) return
    try {
        def cmake = android.externalNativeBuild.cmake
        if (cmake.path == null) return
        def current = cmake.version
        if (current != null && current.toString() != ver) {
            p.logger.lifecycle("Building: using Android-host CMake ${ver} (project requested ${current})")
        }
        if (current instanceof Property) current.set(ver)
        else cmake.version = ver
    } catch (Throwable ignored) {}
}

def applyNdk = { p ->
    if (System.getenv("DEV_IDE_NDK_REWRITE") != "true") return
    def ver = System.getenv("DEV_IDE_NDK_VERSION")
    if (ver == null || ver.isEmpty()) return
    def android = null
    try { android = p.extensions.findByName("android") } catch (Throwable ignored) {}
    if (android == null) return
    try { android.ndkVersion = ver } catch (Throwable ignored) {}
}

def rewriteClassifiers = { p ->
    p.configurations.configureEach { cfg ->
        cfg.withDependencies { deps ->
            def doomed = []
            deps.each { d ->
                if (!(d instanceof ExternalModuleDependency)) return
                def hit = false
                d.artifacts.each { art -> if (art.classifier != null && NATIVE.contains(art.classifier)) hit = true }
                if (hit) doomed << d
            }
            doomed.each { d ->
                deps.remove(d)
                def repl = p.dependencies.create("${d.group}:${d.name}:${d.version}")
                if (repl instanceof ExternalModuleDependency) {
                    repl.artifact { spec ->
                        spec.name = d.name
                        spec.type = "jar"
                        spec.extension = "jar"
                    }
                }
                deps.add(repl)
            }
        }
    }
}

def cap = { String name ->
    if (name == null || name.length() == 0) return ""
    return name.substring(0, 1).toUpperCase(java.util.Locale.ROOT) + name.substring(1)
}

def registerVariants = { p, slot ->
    try {
        def components = p.extensions.findByName("androidComponents")
        if (components == null) return
        components.onVariants(components.selector().all()) { variant ->
            def flavors = []
            try {
                variant.productFlavors.each { pair ->
                    def second = null
                    try { second = pair.second } catch (Throwable ignored) {}
                    if (second == null) {
                        try { second = pair.get(1) } catch (Throwable ignored) {}
                    }
                    if (second != null) flavors << second.toString()
                }
            } catch (Throwable ignored) {}
            def name = variant.name.toString()
            def buildType = name
            try { if (variant.buildType != null) buildType = variant.buildType.toString() } catch (Throwable ignored) {}
            def debuggable = buildType == "debug"
            try {
                def flag = variant.debuggable
                if (flag instanceof Property) debuggable = flag.get() as boolean
                else if (flag != null) debuggable = flag as boolean
            } catch (Throwable ignored) {}
            def applicationId = null
            if (slot.application) {
                try {
                    def value = variant.applicationId
                    applicationId = value instanceof org.gradle.api.provider.Provider ? value.getOrNull() : value?.toString()
                } catch (Throwable ignored) {}
            }
            slot.variants << [
                    name        : name,
                    buildType   : buildType,
                    flavors     : flavors,
                    assembleTask: "assemble" + cap(name),
                    debuggable  : debuggable,
                    applicationId: applicationId,
            ]
        }
    } catch (Throwable ignored) {}
}

def relPaths = { p, files ->
    def base = p.projectDir.toPath()
    def out = []
    files.each { f ->
        try {
            def path = f.toPath()
            if (path.startsWith(base)) out << base.relativize(path).toString().replace('\\' as char, '/' as char)
            else out << f.path.replace('\\' as char, '/' as char)
        } catch (Throwable ignored) {
            out << f.toString()
        }
    }
    return out
}

def textOf = { value ->
    if (value == null) return null
    try { if (value instanceof Property) value = value.getOrElse(null) } catch (Throwable ignored) {}
    return value == null ? null : value.toString()
}

gradle.beforeProject { p ->
    def slot = [
            variants   : Collections.synchronizedList(new ArrayList()),
            application: false,
            plugins    : Collections.synchronizedSet(new LinkedHashSet()),
    ]
    slots.put(p.path, slot)
    try { rewriteClassifiers(p) } catch (Throwable ignored) {}
    try { p.tasks.withType(JavaExec).configureEach { t -> pointAtJava(t) } } catch (Throwable ignored) {}
    p.plugins.withId("com.android.application") {
        slot.application = true
        slot.plugins.add("com.android.application")
        registerVariants(p, slot)
        // Unlike model best-effort reads, opted-in instrumentation failures are never swallowed.
        applyReliability(p)
    }
    p.plugins.withId("com.android.library") {
        slot.plugins.add("com.android.library")
        registerVariants(p, slot)
    }
    p.plugins.withId("com.android.dynamic-feature") {
        slot.plugins.add("com.android.dynamic-feature")
        registerVariants(p, slot)
    }
    ["java", "java-library", "application", "org.jetbrains.kotlin.jvm", "org.jetbrains.kotlin.android"].each { id ->
        p.plugins.withId(id) { slot.plugins.add(id) }
    }
    p.afterEvaluate {
        try { narrow(p) } catch (Throwable ignored) {}
        try { applyCmake(p) } catch (Throwable ignored) {}
        try { applyNdk(p) } catch (Throwable ignored) {}
        try { p.tasks.withType(JavaExec).each { t -> pointAtJava(t) } } catch (Throwable ignored) {}
    }
}

gradle.projectsEvaluated {
    if (reliabilityDescriptor != null) {
        def missing = reliabilityDescriptor.variants.findAll { !reliabilityMatched.contains(it.modulePath + ':' + it.variant) }
        if (!missing.isEmpty()) throw new GradleException('Reliability: opted-in application variants were not found; sync again. Libraries and test fixtures are not instrumented.')
    }
    rootProject.allprojects { p ->
        try { narrow(p) } catch (Throwable ignored) {}
        try { applyCmake(p) } catch (Throwable ignored) {}
        try { applyNdk(p) } catch (Throwable ignored) {}
        try { p.tasks.withType(JavaExec).each { t -> pointAtJava(t) } } catch (Throwable ignored) {}
    }

    def modules = []
    def buildTools = new LinkedHashSet()
    def platforms = new LinkedHashSet()
    def ndks = new LinkedHashSet()
    def cmakes = new LinkedHashSet()
    rootProject.allprojects { p ->
        def slot = slots.get(p.path)
        if (slot == null) return
        def interesting = slot.application || !slot.plugins.isEmpty() || !slot.variants.isEmpty()
        if (!interesting) return
        def android = false
        slot.plugins.each { id -> if (id.toString().startsWith("com.android.")) android = true }
        def variants = new ArrayList(slot.variants)
        if (variants.isEmpty() && !android && !slot.plugins.isEmpty()) {
            variants << [name: "main", buildType: "main", flavors: [], assembleTask: "assemble", debuggable: true]
        }
        def sourceSets = []
        try {
            def main = p.sourceSets.findByName("main")
            if (main != null) {
                def kotlinDirs = []
                try { if (main.hasProperty("kotlin")) kotlinDirs = relPaths(p, main.kotlin.srcDirs) } catch (Throwable ignored) {}
                sourceSets << [
                        name     : "main",
                        java     : relPaths(p, main.java.srcDirs),
                        kotlin   : kotlinDirs,
                        resources: relPaths(p, main.resources.srcDirs),
                ]
            }
        } catch (Throwable ignored) {}
        def dependencies = []
        ["api", "implementation", "compileOnly", "runtimeOnly"].each { cfgName ->
            try {
                def cfg = p.configurations.findByName(cfgName)
                if (cfg == null) return
                cfg.dependencies.each { d ->
                    if (d instanceof org.gradle.api.artifacts.ProjectDependency) {
                        dependencies << [configuration: cfgName, coordinate: null, project: d.dependencyProject.path]
                    } else if (d instanceof ExternalModuleDependency && d.group != null && d.name != null) {
                        def ver = d.version == null ? "" : d.version
                        dependencies << [configuration: cfgName, coordinate: "${d.group}:${d.name}:${ver}", project: null]
                    }
                }
            } catch (Throwable ignored) {}
        }
        def namespace = null
        def compileSdk = null
        def minSdk = null
        def targetSdk = null
        def buildToolsVersion = null
        def ndkVersion = null
        def cmakeVersion = null
        def nativeBuild = false
        def aidl = false
        try {
            def ext = p.extensions.findByName("android")
            if (ext != null) {
                namespace = textOf(ext.namespace)
                try { compileSdk = textOf(ext.compileSdk) } catch (Throwable ignored) {}
                if (compileSdk == null) try { compileSdk = textOf(ext.compileSdkVersion) } catch (Throwable ignored) {}
                try { minSdk = textOf(ext.defaultConfig.minSdk) } catch (Throwable ignored) {
                    try { minSdk = textOf(ext.defaultConfig.minSdkVersion) } catch (Throwable ignored2) {}
                }
                try { targetSdk = textOf(ext.defaultConfig.targetSdk) } catch (Throwable ignored) {
                    try { targetSdk = textOf(ext.defaultConfig.targetSdkVersion) } catch (Throwable ignored2) {}
                }
                try { buildToolsVersion = textOf(ext.buildToolsVersion) } catch (Throwable ignored) {}
                try { ndkVersion = textOf(ext.ndkVersion) } catch (Throwable ignored) {}
                try { cmakeVersion = textOf(ext.externalNativeBuild.cmake.version) } catch (Throwable ignored) {}
                try { nativeBuild = ext.externalNativeBuild.cmake.path != null || ext.externalNativeBuild.ndkBuild.path != null } catch (Throwable ignored) {}
                try {
                    def flag = ext.buildFeatures.aidl
                    aidl = flag instanceof Property ? (flag.get() as boolean) : (flag as boolean)
                } catch (Throwable ignored) {}
            }
        } catch (Throwable ignored) {}
        if (buildToolsVersion != null) buildTools.add(buildToolsVersion)
        // Application packaging also needs llvm-strip for JNI libraries in dependencies.
        if (ndkVersion != null && (nativeBuild || slot.application)) ndks.add(ndkVersion)
        if (cmakeVersion != null && nativeBuild) cmakes.add(cmakeVersion)
        if (compileSdk != null) platforms.add(compileSdk)
        def rootDir = rootProject.projectDir.toPath()
        def rel = ""
        try { rel = rootDir.relativize(p.projectDir.toPath()).toString().replace('\\' as char, '/' as char) } catch (Throwable ignored) {}
        modules << [
                name              : p.name,
                path              : p.path,
                dir               : rel,
                plugins           : new ArrayList(slot.plugins),
                application       : slot.application,
                variants          : variants,
                sourceSets        : sourceSets,
                dependencies      : dependencies,
                namespace         : namespace,
                compileSdk        : compileSdk,
                minSdk            : minSdk,
                targetSdk         : targetSdk,
                buildToolsVersion : buildToolsVersion,
                ndkVersion        : ndkVersion,
                cmakeVersion      : cmakeVersion,
                aidl              : aidl,
        ]
    }
    def issues = []
    removed.each { abi ->
        issues << [severity: "warning", message: "ABI ${abi} skipped; the APK is arm64-v8a only"]
    }
    def model = [
            schemaVersion      : 2,
            name               : rootProject.name,
            gradleVersion      : gradle.gradleVersion,
            modules            : modules,
            issues             : issues,
            buildToolsVersions : new ArrayList(buildTools),
            platforms          : new ArrayList(platforms),
            ndkVersions        : new ArrayList(ndks),
            cmakeVersions      : new ArrayList(cmakes),
    ]
    if (modelOut != null) {
        def file = new File(modelOut)
        if (file.parentFile != null) file.parentFile.mkdirs()
        file.setText(groovy.json.JsonOutput.toJson(model), "UTF-8")
    }
    if (abiReport != null) {
        def file = new File(abiReport)
        if (file.parentFile != null) file.parentFile.mkdirs()
        def lines = new ArrayList(removed)
        Collections.sort(lines)
        file.setText(lines.join("\n") + (lines.isEmpty() ? "" : "\n"), "UTF-8")
    }
}
