version = 2

[module]
type = "java-lib"
name = "gradle-build"
languageLevel = "JAVA_17"
output = "build/codeassist/classes"

[sourceSets.main]
scope = "IMPLEMENTATION"
java = ["src/main/kotlin"]
resources = ["src/main/resources"]

[sourceSets.test]
scope = "TEST_IMPLEMENTATION"
java = ["src/test/kotlin"]

[dependencies]
api = [{ module = "build-engine" }]
implementation = [{ module = "platform-json" }, "org.apache.commons:commons-compress:1.27.1", "org.tukaani:xz:1.10", "kotlin-stdlib"]
testImplementation = [{ platform = "org.junit:junit-bom:5.11.4" }, "org.jetbrains.kotlin:kotlin-test:2.5.0-Beta2", { module = "test-support" }]
