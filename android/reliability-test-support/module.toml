version = 2

[module]
type = "java-lib"
name = "reliability-test-support"
languageLevel = "JAVA_17"
output = "build/codeassist/classes"

[sourceSets.main]
scope = "IMPLEMENTATION"
java = ["src/main/java"]

[sourceSets.test]
scope = "TEST_IMPLEMENTATION"
java = ["src/test/java"]

[dependencies]
compileOnly = ["com.google.android:android:4.1.1.4"]
testImplementation = [{ platform = "org.junit:junit-bom:5.11.4" }, "com.google.android:android:4.1.1.4"]
