version = 2

[module]
type = "java-lib"
name = "android-sdk-metadata"
languageLevel = "JAVA_17"
output = "build/codeassist/classes"

[sourceSets.main]
scope = "IMPLEMENTATION"
java = ["src/main/kotlin"]

[dependencies]
implementation = [{ module = "android-support" }, "org.ow2.asm:asm:9.7", "com.android.tools:r8:8.13.19", { module = "lang-java" }, "kotlin-stdlib"]
testImplementation = [{ platform = "org.junit:junit-bom:5.11.4" }, "org.jetbrains.kotlin:kotlin-test:2.5.0-Beta2", { module = "test-support" }]
