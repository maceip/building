org.gradle.parallel=true
org.gradle.caching=true
# Full IDE AAB packaging exceeds a 4 GiB heap; bound parallel compiler work too.
org.gradle.workers.max=2
# R8 whole-program on the experimental minified variant (bundled kotlinc + platform)
# OOMs below this; measured floor for minifyMinifiedWithR8.
org.gradle.jvmargs=-Xmx12g -Dfile.encoding=UTF-8
kotlin.code.style=official

# :ide-ui declares a custom `jvmShared` intermediate source set (shared by the desktop + android targets so
# it can depend on the plain-JVM layout-preview-api). Explicit dependsOn edges conflict with the default
# Kotlin hierarchy template, so it stays off and every intermediate set is wired by hand. That now includes
# the UI modules' `iosMain`: with the template disabled nothing creates an apple/ios set implicitly, so a
# module carrying iOS actuals declares one and points its ios target's main set at it.
kotlin.mpp.applyDefaultHierarchyTemplate=false
# :jvm-vm references its skikoBridges cinterop stubs from the shared iosMain source set. Without cinterop
# commonization the intermediate iosMain metadata compilation cannot see the cinterop stubs and full
# `./gradlew build` fails at :jvm-vm:compileIosMainKotlinMetadata.
kotlin.mpp.enableCInteropCommonization=true
