version = 2

[module]
type = "java-lib"
name = "store-impl"
languageLevel = "JAVA_17"
output = "build/codeassist/classes"

[sourceSets.commonMain]
scope = "IMPLEMENTATION"
java = ["src/commonMain/kotlin"]

[sourceSets.jvmMain]
scope = "IMPLEMENTATION"
java = ["src/jvmMain/kotlin"]

[sourceSets.jvmTest]
scope = "TEST_IMPLEMENTATION"
java = ["src/jvmTest/kotlin"]
resources = ["src/jvmTest/resources"]

[dependencies]
implementation = [{ module = "store-api" }, { module = "platform-json" }, "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0", { module = "platform-core" }, "kotlin-stdlib"]
testImplementation = [{ module = "test-support" }, { platform = "org.junit:junit-bom:5.11.4" }]

[kotlin]
commonSourceRoots = ["src/commonMain/kotlin"]
