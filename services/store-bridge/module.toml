version = 2

[module]
type = "java-lib"
name = "store-bridge"
languageLevel = "JAVA_17"
output = "build/codeassist/classes"

[sourceSets.commonMain]
scope = "IMPLEMENTATION"
java = ["src/commonMain/kotlin"]

[sourceSets.jvmMain]
scope = "IMPLEMENTATION"
java = ["src/jvmMain/kotlin"]

[sourceSets.jvmTest]
scope = "TEST_IMPLEMENTATION"
java = ["src/jvmTest/kotlin"]

[dependencies]
api = [{ module = "store-api" }, { module = "ide-ui-api" }]
implementation = [{ module = "store-impl" }, "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0", { module = "model-api" }, "kotlin-stdlib"]
testImplementation = ["org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0", { platform = "org.junit:junit-bom:5.11.4" }]

[kotlin]
commonSourceRoots = ["src/commonMain/kotlin"]
